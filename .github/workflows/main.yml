name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  contract:
    name: Build Rust Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
          components: clippy
      - name: Build contract
        working-directory: ./contract
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Run tests
        working-directory: ./contract
        run: cargo test
      - name: Format check
        working-directory: ./contract
        run: cargo fmt --all -- --check || true
      - name: Run clippy lint
        working-directory: ./contract
        run: cargo clippy --all-targets -- -D warnings
  client:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
        working-directory: ./client
      - name: Lint
        working-directory: ./client
        run: npx eslint . || true
      - name: Build
        working-directory: ./client
        run: npx next build
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [contract, client]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Check if contract changed
        id: contract_changed
        run: |
          if git diff --quiet HEAD^ HEAD -- contract/ 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Install Stellar CLI
        if: steps.contract_changed.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
          cargo install --locked stellar-cli
      - name: Build Contract
        if: steps.contract_changed.outputs.changed == 'true'
        working-directory: ./contract
        run: |
          rustup target add wasm32v1-none
          stellar contract build
      - name: Configure Stellar Network
        if: steps.contract_changed.outputs.changed == 'true'
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"
          stellar keys generate alice --network testnet --fund
          echo "Waiting for account to be available..."
          sleep 15
      - name: Deploy Contract to Testnet
        if: steps.contract_changed.outputs.changed == 'true'
        working-directory: ./contract
        run: |
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/contract.wasm \
            --source-account alice \
            --network testnet
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=nishant-kumar-s-projects16
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
