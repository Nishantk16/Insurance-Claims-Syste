name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  contract:
    name: Build Rust Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
          components: clippy
      - name: Build contract
        working-directory: ./contract
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Run tests
        working-directory: ./contract
        run: cargo test
      - name: Format check
        working-directory: ./contract
        run: cargo fmt --all -- --check
      - name: Run clippy lint
        working-directory: ./contract
        run: cargo clippy --all-targets -- -D warnings
  client:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
        working-directory: ./client
      - name: Lint
        working-directory: ./client
        run: npx eslint . || true
      - name: Build
        working-directory: ./client
        run: npx next build
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [contract, client]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Stellar CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
          cargo install --locked stellar-cli
      - name: Build Contract
        run: |
          cargo build --target wasm32-unknown-unknown --release --manifest-path contract/Cargo.toml
          cp contract/target/wasm32-unknown-unknown/release/*.wasm contract/target/wasm32-unknown-unknown/release/contract.optimized.wasm
      - name: Configure Stellar Network
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"
          stellar keys generate alice --network testnet --fund
      - name: Deploy Contract to Testnet
        run: |
          stellar contract deploy \
            --wasm contract/target/wasm32-unknown-unknown/release/contract.optimized.wasm \
            --source-account alice \
            --network testnet
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=nishant-kumar-s-projects16
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
